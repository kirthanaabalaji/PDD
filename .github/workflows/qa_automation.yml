name: QA Automation Framework Execution

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  run-qa-suite:
    name: Execute QA Tests and Verification Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qa/requirements.txt

      - name: Generate Framework Test Files
        run: |
          python qa/generate_framework.py

      - name: Execute QA Test & Audit Pipeline
        run: |
          python qa/run_tests.py

      - name: Upload Selenium Test Cases Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_Test_Cases
          path: qa/artifacts/Selenium_Test_Cases/
          if-no-files-found: error

      - name: Upload Appium Test Cases Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appium_Test_Cases
          path: qa/artifacts/Appium_Test_Cases/
          if-no-files-found: error

      - name: Upload Load Test Cases Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Load_Test_Cases
          path: qa/artifacts/Load_Test_Cases/
          if-no-files-found: error

      - name: Upload Security Test Cases Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Security_Test_Cases
          path: qa/artifacts/Security_Test_Cases/
          if-no-files-found: error

      - name: Upload Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reports
          path: qa/reports/
          if-no-files-found: error

      - name: Upload Logs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: qa/logs/
          if-no-files-found: error

      - name: Upload Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: qa/evidence/
          if-no-files-found: error

      - name: Render Job Step Summary
        run: |
          if [ -f qa/reports/github_step_summary.md ]; then
            cat qa/reports/github_step_summary.md >> $GITHUB_STEP_SUMMARY
          fi

