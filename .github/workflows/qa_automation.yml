name: QA Automation Framework Execution

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  run-qa-suite:
    name: Execute QA Tests and Verification Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qa/requirements.txt

      - name: Generate Framework Test Files
        run: |
          python qa/generate_framework.py

      - name: Execute QA Test & Audit Pipeline
        run: |
          python qa/run_tests.py

      - name: Upload Web Selenium Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Web Selenium Test Report
          path: |
            qa/reports/Web_Selenium_Test_Report.xlsx
            qa/reports/Web_Selenium_Test_Report.csv
          if-no-files-found: error

      - name: Upload Android Appium Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Android Appium Test Report
          path: |
            qa/reports/Android_Appium_Test_Report.xlsx
            qa/reports/Android_Appium_Test_Report.csv
          if-no-files-found: error

      - name: Upload Performance & Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Performance & Load Test Report
          path: |
            qa/reports/Performance_Load_Test_Report.xlsx
            qa/reports/Performance_Load_Test_Report.csv
          if-no-files-found: error

      - name: Upload Security Assessment Report
        uses: actions/upload-artifact@v4
        with:
          name: Security Assessment Report
          path: |
            qa/reports/Security_Assessment_Report.xlsx
            qa/reports/Security_Assessment_Report.csv
          if-no-files-found: error

      - name: Upload QA Summary Reports
        uses: actions/upload-artifact@v4
        with:
          name: QA Summary Reports
          path: |
            qa/reports/QA_Summary_Reports.xlsx
            qa/reports/junit_report.xml
            qa/reports/allure_dashboard.html
            qa/reports/extent_dashboard.html
            qa/reports/QA_Executive_Report.pdf
            qa/reports/uniqueness_verification_report.md
            qa/reports/executive_summary_report.md
          if-no-files-found: error
